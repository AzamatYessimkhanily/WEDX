<body>

<header>
  <div class="wrap">
    <div class="htop">
      <h1>Программа</h1>
      <div class="header-actions">
        <button id="tab-health" class="progbtn" aria-pressed="false">Питание</button>
        <button id="tab-prog" class="progbtn">Прогресс</button>
      </div>
    </div>
    <div class="days" id="days" role="tablist"></div>
    <div class="ptabs" id="ptabs" role="tablist"></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="dock" id="dock">
  <div class="dockin">
    <div class="dtop">
      <div class="clock" id="clock">0:00</div>
      <div class="dnext">
        <div class="lbl" id="tlbl">Отдых</div>
        <div class="val" id="tval"></div>
      </div>
    </div>
    <div class="tbar"><i id="tfill"></i></div>
    <div id="timer-push-state" class="timer-push-state" role="status"></div>
    <div class="dbtns">
      <button id="add30">+30 сек</button>
      <button id="skip" class="main">Пропустить</button>
    </div>
    <div id="work-controls" class="work-controls" hidden>
      <button id="work-pause">Пауза</button>
      <button id="work-save">Записать время</button>
      <button id="work-reset">Заново</button>
      <button id="work-cancel">Отмена</button>
      <small class="work-timer-note">Для звукового сигнала оставь приложение открытым</small>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module" src="/src/app.js"></script>
</body>
</html>
