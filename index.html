<title>Программа тренировок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#132430;
    --surface:#1B3242;
    --surface-2:#22404F;
    --surface-3:#2A4B5C;
    --line:#2E5164;
    --amber:#F0B429;
    --amber-dim:#8A6816;
    --amber-wash:rgba(240,180,41,.12);
    --done:#48B58C;
    --done-wash:rgba(72,181,140,.14);
    --text:#E8F0F4;
    --muted:#8DA9B8;
    --danger:#D96A5B;
    --danger-wash:rgba(217,106,91,.14);
    --r:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  html,body{margin:0;padding:0;touch-action:pan-y;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Barlow Semi Condensed','Roboto Condensed',system-ui,-apple-system,sans-serif;
    font-size:17px;
    line-height:1.35;
    font-variant-numeric:tabular-nums;
    padding-bottom:190px;
    overscroll-behavior-y:contain;
    -webkit-user-select:none;user-select:none;
  }
  input{-webkit-user-select:text;user-select:text;}
  button,input,.day,.chk{touch-action:manipulation;}
  .wrap{max-width:560px;margin:0 auto;padding:0 14px;}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:40;
    background:rgba(19,36,48,.96);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .htop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 8px;}
  .htop h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.2px;white-space:nowrap;}
  .progbtn{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    font-family:inherit;font-size:14.5px;font-weight:600;padding:6px 13px;
    border-radius:99px;cursor:pointer;
  }
  .progbtn.on{background:var(--amber);border-color:var(--amber);color:#12222C;}
  .progbtn:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .days{display:flex;gap:6px;padding-bottom:10px;}
  .day{
    flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:var(--r);padding:8px 4px;cursor:pointer;font-family:inherit;
    font-size:15px;font-weight:600;line-height:1.15;text-align:center;transition:.12s;
  }
  .day small{display:block;font-size:12px;font-weight:400;opacity:.8;margin-top:2px;}
  .day[aria-selected="true"]{background:var(--amber);border-color:var(--amber);color:#12222C;}
  .day:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .ptabs{display:none;gap:6px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none;}
  .ptabs::-webkit-scrollbar{display:none;}
  .ptab{
    flex:1 0 auto;border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:99px;padding:7px 12px;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .ptab[aria-selected="true"]{background:var(--surface-3);border-color:var(--muted);color:var(--text);}

  /* ---------- day meta ---------- */
  .daymeta{display:flex;align-items:center;gap:10px;padding:14px 0 6px;}
  .daymeta h2{font-size:19px;margin:0;font-weight:600;flex:1;}
  .bar{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:6px;}
  .bar i{display:block;height:100%;background:var(--done);width:0;transition:width .25s;}
  .count{font-size:15px;color:var(--muted);white-space:nowrap;}
  .daterow{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13.5px;color:var(--muted);flex-wrap:wrap;}
  .daterow .dl{flex:1;min-width:120px;}
  .daterow .dl b{color:var(--amber);font-weight:600;}
  .daterow.back{background:var(--amber-wash);border:1px solid var(--amber-dim);border-radius:8px;padding:7px 10px;}
  .daterow input[type=date]{
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-family:inherit;font-size:14.5px;
    font-weight:600;border-radius:8px;padding:6px 9px;min-height:34px;-webkit-appearance:none;appearance:none;
  }
  .daterow input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.8);}
  .daterow button{
    background:transparent;border:1px solid var(--line);color:var(--muted);font-family:inherit;font-size:13.5px;
    padding:6px 10px;border-radius:8px;cursor:pointer;
  }
  .livevol{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);margin-bottom:12px;}
  .livevol b{color:var(--text);font-weight:600;}

  /* ---------- exercise ---------- */
  .ex{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);margin-bottom:10px;overflow:hidden;
  }
  .ex.complete{border-color:var(--done);}
  .exhead{display:flex;gap:10px;padding:11px 12px 6px;align-items:flex-start;}
  .num{font-size:15px;font-weight:700;color:var(--muted);min-width:19px;padding-top:1px;}
  .ex.complete .num{color:var(--done);}
  .exinfo{flex:1;min-width:0;}
  .exname{font-size:17px;font-weight:600;line-height:1.2;}
  .extags{font-size:13.5px;color:var(--muted);margin-top:3px;}
  .extags b{color:var(--amber);font-weight:600;}

  .lastline{
    display:flex;align-items:center;gap:8px;margin:4px 12px 0 41px;
    padding:7px 10px;border-radius:8px;background:var(--surface-2);
    font-size:13.5px;color:var(--muted);cursor:pointer;border:1px solid transparent;
    font-family:inherit;text-align:left;width:calc(100% - 53px);
  }
  .lastline:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .lastline .ll{flex:1;min-width:0;line-height:1.35;}
  .lastline .ll b{color:var(--text);font-weight:600;}
  .lastline .chev{width:16px;height:16px;flex-shrink:0;transition:transform .15s;color:var(--muted);}
  .ex.hopen .lastline .chev{transform:rotate(180deg);}
  .lastline.empty{cursor:default;opacity:.7;}
  .hpanel{display:none;margin:6px 12px 0 41px;border-top:1px solid var(--line);padding-top:6px;}
  .ex.hopen .hpanel{display:block;}
  .hrow{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-bottom:1px solid rgba(46,81,100,.5);font-size:13.5px;}
  .hrow:last-child{border-bottom:none;}
  .hedit{background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;}
  .hedit small{display:block;font-size:11px;color:var(--amber);opacity:.85;margin-top:2px;}
  .hdate{color:var(--muted);min-width:44px;padding-top:2px;}
  .hsets{flex:1;min-width:0;}
  .hvol{color:var(--muted);white-space:nowrap;padding-top:2px;text-align:right;min-width:52px;}
  .hvol b{color:var(--text);font-weight:600;display:block;}
  .chips{display:flex;flex-wrap:wrap;gap:4px;}
  .chip{
    display:inline-block;padding:2px 7px;border-radius:6px;background:var(--surface-3);
    font-size:13px;font-weight:600;color:var(--text);line-height:1.35;
  }
  .chip.top{background:var(--done-wash);color:var(--done);}
  .chip.low{background:var(--danger-wash);color:var(--danger);}
  .chip.skip{background:transparent;border:1px dashed var(--line);color:var(--muted);font-weight:400;}
  .chip.today{outline:1px solid var(--amber);}
  .ready{
    display:inline-flex;align-items:center;gap:5px;margin-top:6px;padding:4px 9px;border-radius:6px;
    background:var(--amber-wash);color:var(--amber);font-size:13px;font-weight:600;
  }
  .ready.hold{background:var(--danger-wash);color:var(--danger);}
  .ready svg{width:13px;height:13px;}
  .hnote{font-size:13px;color:var(--muted);margin-top:3px;font-style:italic;}
  .notebtn{
    background:transparent;border:1px dashed var(--line);color:var(--muted);font-family:inherit;
    font-size:13px;padding:5px 10px;border-radius:6px;cursor:pointer;margin-top:8px;
  }

  .sets{padding:6px 12px 11px;}
  .srow{
    display:grid;grid-template-columns:22px 1fr 1fr 46px;
    gap:7px;align-items:center;margin-top:7px;
  }
  .slabel{font-size:14px;color:var(--muted);text-align:center;line-height:1.1;}
  .fld{position:relative;}
  .fld input{
    width:100%;background:var(--surface-2);border:1px solid transparent;
    color:var(--text);font-family:inherit;font-size:17px;font-weight:600;
    border-radius:8px;padding:9px 30px 9px 9px;
    -moz-appearance:textfield;appearance:textfield;
  }
  .fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .fld input::placeholder{color:var(--muted);opacity:.7;font-weight:500;}
  .fld input:focus{outline:none;border-color:var(--amber);}
  .fld span{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    font-size:12.5px;color:var(--muted);pointer-events:none;
  }
  .chk{
    height:38px;border-radius:8px;border:1px solid var(--line);
    background:transparent;cursor:pointer;color:var(--muted);
    display:flex;align-items:center;justify-content:center;transition:.12s;
  }
  .chk svg{width:19px;height:19px;}
  .chk[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:#0F2620;}
  .chk:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .srow.on .fld input{background:var(--done-wash);color:var(--done);}
  .srow.on .slabel{color:var(--done);}
  .srow.beat .fld input{border-color:rgba(72,181,140,.55);}
  .srow.short .fld input{border-color:var(--amber-dim);}
  .fld span.was{font-size:12px;}
  .fld span.was b{color:var(--text);font-weight:600;}
  .fld.hasw input{padding-right:58px;}
  .drow{
    display:grid;grid-template-columns:22px 1fr 1fr 46px;
    gap:7px;align-items:center;margin-top:5px;
  }
  .drow .slabel{color:var(--amber);font-size:16px;}
  .drow .fld input{padding-top:7px;padding-bottom:7px;font-size:16px;border-color:var(--amber-dim);background:var(--amber-wash);}
  .dx{
    height:34px;border-radius:8px;border:1px solid var(--line);background:transparent;
    color:var(--muted);font-size:20px;line-height:1;cursor:pointer;font-family:inherit;
  }
  .addx{
    display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;margin:5px 0 0 29px;padding:4px 10px;
    background:transparent;border:1px dashed var(--line);border-radius:7px;
    color:var(--muted);font-family:inherit;font-size:13px;cursor:pointer;text-align:left;
  }
  .addx b{font-weight:600;}
  .addx span{opacity:.75;}
  .addx.need{border-color:var(--amber-dim);color:var(--amber);}

  /* ---------- timer dock ---------- */
  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--surface);border-top:1px solid var(--line);
    padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    transform:translateY(105%);transition:transform .22s ease;
  }
  .dock.up{transform:translateY(0);}
  .dockin{max-width:560px;margin:0 auto;}
  .dtop{display:flex;align-items:center;gap:12px;}
  .clock{font-size:52px;font-weight:700;line-height:.9;letter-spacing:-1px;color:var(--amber);min-width:118px;}
  .clock.zero{color:var(--done);}
  .dnext{flex:1;min-width:0;}
  .dnext .lbl{font-size:13px;color:var(--muted);}
  .dnext .val{font-size:16px;font-weight:600;line-height:1.2;margin-top:2px;}
  .dbtns{display:flex;gap:7px;margin-top:10px;}
  .dbtns button{
    flex:1;padding:11px 6px;border-radius:8px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--text);font-family:inherit;
    font-size:15.5px;font-weight:600;cursor:pointer;
  }
  .dbtns button.main{background:var(--amber);border-color:var(--amber);color:#12222C;}
  .tbar{height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:9px;}
  .tbar i{display:block;height:100%;background:var(--amber);width:100%;}

  /* ---------- rest / footer / rules ---------- */
  .restday{text-align:center;padding:46px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);}
  .restday b{display:block;color:var(--text);font-size:19px;margin-bottom:6px;}
  .foot{padding:20px 0 8px;}
  .foot button{
    width:100%;padding:12px;border-radius:var(--r);border:1px solid var(--line);
    background:transparent;color:var(--muted);font-family:inherit;font-size:15.5px;cursor:pointer;
  }
  .foot .row{display:flex;gap:8px;margin-top:8px;}
  .foot .row>*{flex:1 1 0;min-width:0;}
  .foot .btnlink{
    flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;border-radius:var(--r);border:1px solid var(--line);
    color:var(--amber);font-size:15.5px;text-decoration:none;
  }
  .cloudbox{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);}
  .cloudbox .row{margin-top:10px;}
  .cloudst{font-size:14.5px;font-weight:600;color:var(--text);}
  .cloudst.warn{color:var(--amber);}
  .cloudhelp{font-size:13.5px;color:var(--muted);margin-top:6px;line-height:1.45;}
  .cloudhelp b{color:var(--text);font-weight:600;}
  .rules{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;}
  .rules summary{cursor:pointer;font-size:16px;font-weight:600;color:var(--muted);padding:6px 0;}
  .rules ol{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:15.5px;}
  .rules li{margin-bottom:7px;}
  .rules b{color:var(--text);font-weight:600;}
  .vol{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px;}
  .vol td{padding:5px 0;border-bottom:1px solid var(--line);color:var(--muted);}
  .vol td:last-child{text-align:right;color:var(--text);font-weight:600;}

  /* ---------- progress: overview ---------- */
  .pgroup{margin-top:18px;}
  .pgroup h3{font-size:17px;margin:0 0 8px;font-weight:600;color:var(--amber);}
  .pgroup h3 small{color:var(--muted);font-weight:400;font-size:14px;}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px;}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;}
  .tile .tl{font-size:13px;color:var(--muted);}
  .tile .tv{font-size:26px;font-weight:700;line-height:1.1;margin-top:3px;font-variant-numeric:normal;}
  .tile .tv small{font-size:13px;font-weight:500;color:var(--muted);margin-left:3px;}
  .tile .td{font-size:13px;margin-top:3px;color:var(--muted);}
  .up{color:var(--done);}
  .down{color:var(--danger);}
  .flat{color:var(--muted);}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-top:8px;}
  .card h4{margin:0;font-size:15.5px;font-weight:600;}
  .card .sub{font-size:13px;color:var(--muted);margin-top:1px;}
  .chead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}

  /* ---------- charts ---------- */
  .chart{position:relative;margin-top:4px;padding-top:62px;}
  .chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y;}
  .chart .ax{font-size:11px;fill:var(--muted);}
  .chart .grid{stroke:var(--line);stroke-width:1;}
  .chart .ln{fill:none;stroke:var(--amber);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .chart .ar{fill:var(--amber);opacity:.10;}
  .chart .dot{fill:var(--amber);stroke:var(--surface);stroke-width:2;}
  .chart .dot.pr{fill:var(--done);}
  .chart .cross{stroke:var(--muted);stroke-width:1;opacity:0;}
  .chart .hit{fill:transparent;}
  .chart .bar{fill:var(--amber);}
  .chart .bar.dim{fill:var(--amber-dim);}
  .chart .bar.hot{fill:#F6C95A;}
  .chart .endl{font-size:12px;font-weight:600;fill:var(--text);}
  .tip{
    position:absolute;top:0;left:0;transform:translate(-50%,0);pointer-events:none;
    background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;
    font-size:13px;line-height:1.3;color:var(--muted);white-space:nowrap;z-index:5;opacity:0;transition:opacity .1s;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  .tip.show{opacity:1;}
  .tip b{display:block;color:var(--text);font-size:15px;font-weight:700;}
  .tip .ts{display:block;margin-top:2px;color:var(--text);}
  .mchips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .mchip{
    border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;
    padding:5px 11px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;
  }
  .mchip[aria-pressed="true"]{background:var(--surface-3);border-color:var(--muted);color:var(--text);}

  /* ---------- heatmap ---------- */
  .heat{display:grid;grid-auto-flow:column;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(7,auto);gap:3px;margin-top:10px;}
  .hcell{aspect-ratio:1;border-radius:4px;background:var(--surface-2);cursor:pointer;}
  .hcell.l1{background:#5A4A1E;}
  .hcell.l2{background:#8A6816;}
  .hcell.l3{background:#C4931F;}
  .hcell.l4{background:var(--amber);}
  .hcell.today{outline:1.5px solid var(--text);outline-offset:-1px;}
  .hcell.future{opacity:.35;cursor:default;}
  .hcell.sel{outline:2px solid var(--text);outline-offset:-1px;}
  .heatlbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:5px;}
  .heatinfo{margin-top:8px;font-size:13.5px;color:var(--muted);min-height:20px;}
  .heatinfo b{color:var(--text);font-weight:600;}

  /* ---------- PR list / body weight ---------- */
  .prrow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid rgba(46,81,100,.5);font-size:14px;}
  .prrow:last-child{border-bottom:none;}
  .prrow .pd{color:var(--muted);min-width:44px;font-size:13px;padding-top:2px;}
  .prrow .pn{flex:1;min-width:0;}
  .prrow .pn small{display:block;color:var(--muted);font-size:13px;}

/* ---------- облако: секретный gist в GitHub пользователя ---------- */
const CKEY=KEY+"-cloud",GH="https://api.github.com/gists",GFILE="wedx-gym-log.json";
const TOKEN_URL="https://github.com/settings/tokens/new?scopes=gist&description=WEDX%20backup";
let cloud=null,pushT=null,pushing=false,pushAgain=false,syncing=false;
function cloudLoad(){try{cloud=JSON.parse(localStorage.getItem(CKEY)||"null");}catch(e){cloud=null;}}
function cloudStore(){try{if(cloud)localStorage.setItem(CKEY,JSON.stringify(cloud));else localStorage.removeItem(CKEY);}catch(e){}}
function gh(path,opt){
  opt=opt||{};
  const h={Authorization:"Bearer "+cloud.token,Accept:"application/vnd.github+json"};
  if(opt.body)h["Content-Type"]="application/json";
  return fetch(GH+path,{method:opt.method||"GET",body:opt.body,headers:h,keepalive:!!opt.keepalive,cache:"no-store"})
    .then(r=>{if(!r.ok)throw r.status;return r.json();});
}
async function cloudRead(id){
  const g=await gh("/"+id);
  const f=g.files&&g.files[GFILE];
  if(!f)return null;
  const txt=f.truncated?await fetch(f.raw_url,{cache:"no-store"}).then(r=>r.text()):f.content;
  try{const o=JSON.parse(txt);return o&&typeof o==="object"?o:null;}catch(e){return null;}
}
function cloudPending(){return !!(cloud&&cloud.id&&(state.savedAt||0)>(cloud.at||0));}
function cloudSchedule(){
  if(!cloud||!cloud.id)return;
  clearTimeout(pushT);pushT=setTimeout(()=>cloudPush(),4000);
  cloudStatus();
}
function cloudFlush(){if(pushT||cloudPending())cloudPush(true);}
async function cloudPush(keep){
  clearTimeout(pushT);pushT=null;
  if(!cloud||!cloud.id)return;
  if(pushing){pushAgain=true;return;}
  pushing=true;
  const at=state.savedAt||0;
  const body=JSON.stringify({files:{[GFILE]:{content:JSON.stringify(state)}}});
  try{
    await gh("/"+cloud.id,{method:"PATCH",body,keepalive:keep&&body.length<60000});
    cloud.at=Math.max(cloud.at||0,at);cloud.t=Date.now();cloud.err=null;
  }catch(e){cloud.err=e;}
  pushing=false;cloudStore();cloudStatus();
  if(pushAgain){pushAgain=false;cloudPush();}
}
function applyRemote(remote){
  snapshot("Загрузка из облака");
  state=remote;normalize();freshenLogs();writeLocal();
  cloud.at=state.savedAt||0;cloud.t=Date.now();
}
/* при запуске и возвращении в приложение: забрать более свежую копию или дослать свою */
async function cloudSync(){
  if(!cloud||!cloud.id||syncing||saveT||pushT||pushing)return;
  syncing=true;
  try{
    const remote=await cloudRead(cloud.id);
    const rAt=remote&&remote.savedAt||0,lAt=state.savedAt||0;
    if(remote&&rAt>lAt&&!saveT){applyRemote(remote);cloudStore();rerender();toast("Данные обновлены из облака");}
    else if(!remote||lAt>rAt){syncing=false;return cloudPush();}
    else{cloud.at=rAt;cloud.t=Date.now();}
    cloud.err=null;
  }catch(e){cloud.err=e;}
  syncing=false;cloudStore();cloudStatus();
}
async function cloudConnect(){
  const t=(prompt("Вставь токен GitHub (начинается с ghp_):")||"").trim();
  if(!t)return;
  cloud={token:t};
  try{
    const list=await gh("?per_page=100");
    const g=list.find(x=>x.files&&x.files[GFILE]);
    if(g){
      cloud.id=g.id;
      const remote=await cloudRead(g.id);
      if(remote&&confirm("В облаке уже есть копия от "+(remote.savedAt?fmtTime(remote.savedAt):"?")+".\n\nОК - загрузить её на телефон.\nОтмена - оставить данные телефона и отправить их в облако (старая версия останется в истории gist)."))applyRemote(remote);
      else{state.savedAt=Date.now();writeLocal();cloudStore();await cloudPush();}
    }else{
      state.savedAt=state.savedAt||Date.now();writeLocal();
      const ng=await gh("",{method:"POST",body:JSON.stringify({description:"WEDX - резервная копия тренировок",public:false,files:{[GFILE]:{content:JSON.stringify(state)}}})});
      cloud.id=ng.id;cloud.at=state.savedAt;cloud.t=Date.now();
    }
    cloud.err=null;cloudStore();rerender();toast("Облако подключено");
  }catch(e){
    cloud=null;cloudStore();
    alert(e===401?"Токен не подошёл. Проверь, что скопирован целиком и у него стоит галочка gist.":"Не получилось подключиться ("+e+"). Проверь интернет и попробуй ещё раз.");
  }
}
function cloudText(){
  if(!cloud||!cloud.id)return "Облако не подключено - данные есть только в этом телефоне";
  if(cloud.err===401)return "Облако: токен больше не работает - отключи и подключи заново";
  if(cloud.err===404)return "Облако: gist не найден - отключи и подключи заново";
  if(cloud.err)return "Облако: нет связи, отправлю позже"+(cloud.t?" (последняя копия "+fmtTime(cloud.t)+")":"");
  if(pushT||pushing||cloudPending())return "Облако: сохраняю…";
  return "Облако: всё сохранено"+(cloud.t?" · "+fmtTime(cloud.t):"");
}
function cloudStatus(){
  const s=document.getElementById("cloudst");if(!s)return;
  s.textContent=cloudText();
  s.className="cloudst"+(!cloud||!cloud.id||cloud.err?" warn":"");
}
function cloudBox(){
  const box=el("div","cloudbox");
  const st=el("div","cloudst"+(!cloud||!cloud.id||cloud.err?" warn":""));st.id="cloudst";st.textContent=cloudText();
  box.appendChild(st);

      "1. Нажми «Создать токен», войди в GitHub. В <b>Expiration</b> выбери <b>No expiration</b>, галочка <b>gist</b> уже стоит - листай вниз и жми <b>Generate token</b>, скопируй его.<br>"+
      "2. Вернись сюда и нажми «Вставить токен»."));
    const row=el("div","row");
    const a=el("a","btnlink","Создать токен");a.href=TOKEN_URL;a.target="_blank";a.rel="noopener";
    const b=el("button",null,"Вставить токен");b.onclick=cloudConnect;

    const a=el("a","btnlink","История копий");a.href="https://gist.github.com/"+cloud.id+"/revisions";a.target="_blank";a.rel="noopener";
    const x=el("button",null,"Отключить");

function slot(day,i,j){
  const k=day+"|"+i;
  if(!state.log[k])state.log[k]=[];
  if(!state.log[k][j])state.log[k][j]={w:"",r:"",d:false};

/* форма за выбранную дату заполняется тем, что уже записано в истории - правки сразу идут туда же */
function fillFromHist(day,date){
  clearDay(day);
  let any=false;
  PROGRAM[day].ex.forEach((e,i)=>{
    const rec=(state.hist[day+"|"+i]||[]).find(x=>x.d===date);if(!rec)return;
    any=true;
    const sets=rec.s&&rec.s.length?rec.s:Array.from({length:Math.min(rec.n,e.s)},()=>[rec.w,rec.r]);
    state.log[day+"|"+i]=sets.map(x=>x?{w:e.w?String(x[0]):"",r:String(x[1]),d:true,x:x[3]?{w:String(x[2]),r:String(x[3])}:null}:{w:"",r:"",d:false});
  });
  if(any)state.logDate[day]=date;
  return any;
}
function openDate(date){
  logFor=(date===todayKey())?null:date;
  const any=fillFromHist(cur,date);save();renderDay();
  toast(any?"Тренировка "+shortDate(date)+" - правь, всё обновится":(logFor?"Запись за "+shortDate(date):"Запись за сегодня"));
  return any;
}
function clearDay(day){
  PROGRAM[day].ex.forEach((e,i)=>{delete state.log[day+"|"+i];});
  delete state.logDate[day];
}
/* Лог дня живёт один день: назавтра он уже в истории, а форма чистая */
function freshenLogs(){
  const t=todayKey();
  DAY_IDS.forEach(day=>{
    if(logFor&&day===cur)return;
    let ld=state.logDate[day];
    if(!ld){
      const hasDone=PROGRAM[day].ex.some((e,i)=>(state.log[day+"|"+i]||[]).some(s=>s&&s.d));
      if(!hasDone)return;
      let mx="";
      PROGRAM[day].ex.forEach((e,i)=>{const a=state.hist[day+"|"+i];if(a&&a.length&&a[a.length-1].d>mx)mx=a[a.length-1].d;});
      ld=mx||t;
    }
    if(ld!==t)clearDay(day);
  });
}

/* ---------- history ---------- */
function touchSession(day){
  const t=sessDate();
  state.logDate[day]=t;
  if(logFor){state.sess[t]=state.sess[t]||{day:day};state.sess[t].day=day;return;}
  const s=state.sess[t]||(state.sess[t]={day:day,t0:Date.now()});
  s.day=day;s.t1=Date.now();
}
function recordHistory(day,i){
  const e=PROGRAM[day].ex[i], k=day+"|"+i, sets=state.log[k]||[];
  let best=null, vol=0, n=0, per=[];
  for(let j=0;j<e.s;j++){
    const s=sets[j];
    if(!s||!s.d){per.push(null);continue;}
    n++;
    const w=parseFloat(s.w)||0, r=parseFloat(s.r)||0;
    vol+=w*r;
    const xw=s.x?parseFloat(s.x.w)||0:0, xr=s.x?parseFloat(s.x.r)||0:0;
    if(xr>0){vol+=xw*xr;per.push([w,r,xw,xr]);}else per.push([w,r]);
    if(!best||w>best.w||(w===best.w&&r>best.r))best={w:w,r:r};
  }
  while(per.length&&per[per.length-1]===null)per.pop();
  if(!state.hist[k])state.hist[k]=[];
  const arr=state.hist[k], t=sessDate();
  const rec={d:t,w:best?best.w:0,r:best?best.r:0,v:Math.round(vol),n:n,s:per};
  const idx=arr.findIndex(x=>x.d===t);
  if(n===0){ if(idx>=0)arr.splice(idx,1); touchSession(day); return; }
  if(idx>=0)arr[idx]=rec;
  else{ let p=arr.length; while(p>0&&arr[p-1].d>t)p--; arr.splice(p,0,rec); }
  if(arr.length>150)arr.shift();
  touchSession(day);
}
/* прошлая сессия (не сегодняшняя) */
function lastSession(day,i){
  const a=state.hist[day+"|"+i];if(!a)return null;
  const t=sessDate();
  for(let k=a.length-1;k>=0;k--){if(a[k].d<t)return a[k];}
  return null;
}
function todayRec(day,i){
  const a=state.hist[day+"|"+i];if(!a||!a.length)return null;
  const r=a.find(x=>x.d===sessDate());return r||null;
}
function recReps(rec){
  if(rec.s)return rec.s.reduce((a,x)=>a+(x?x[1]:0),0);
  return rec.r*rec.n;
}
function recE1(rec){
  if(rec.s){let m=0;rec.s.forEach(x=>{if(x)m=Math.max(m,e1rm(x[0],x[1]));});return m;}
  return e1rm(rec.w,rec.r);
}
/* Готовность к прогрессии по правилу двойной прогрессии */
function readiness(e,rec){
  if(!rec||!rec.s||!e.w)return null;
  const rg=range(e);
  const done=rec.s.filter(Boolean);
  if(done.length<e.s)return null;
  if(done.every(x=>x[1]>=rg.hi))return {ok:true,txt:"Все подходы на верхней границе - добавь 2.5-5 кг"};
  if(done.filter(x=>x[1]<rg.lo).length>=2)return {ok:false,txt:"Два подхода ниже диапазона - держи или сбавь вес"};
  return null;
}
/* класс чипа подхода относительно диапазона */
function chipCls(e,x){
  if(!x)return "chip skip";
  const rg=range(e);
  if(x[1]>=rg.hi)return "chip top";
  if(x[1]<rg.lo)return "chip low";
  return "chip";
}
function chipTxt(e,x){
  if(!x)return "–";
  if(!e.w||(x[0]===0))return x[1]+(e.sec?"с":"");
  return trim(x[0])+"×"+x[1]+(x[3]?"+"+trim(x[2])+"×"+x[3]:"");
}
function setsHTML(e,rec,todayMark){
  if(rec.s&&rec.s.length){
    return '<div class="chips">'+rec.s.map(x=>'<span class="'+chipCls(e,x)+(todayMark?" today":"")+'">'+chipTxt(e,x)+'</span>').join("")+'</div>';
  }
  const b=e.w&&rec.w?trim(rec.w)+"×"+rec.r:rec.r+(e.sec?"с":"");
  return '<div class="chips"><span class="chip">лучший '+b+'</span><span class="chip skip">'+rec.n+' подх.</span></div>';
}

/* ---------- timer ---------- */
let endAt=0,total=0,tick=null;
const dock=document.getElementById("dock"),clock=document.getElementById("clock"),
      tfill=document.getElementById("tfill"),tval=document.getElementById("tval"),
      tlbl=document.getElementById("tlbl");
function startTimer(sec,label){
  total=sec;endAt=Date.now()+sec*1000;
  tval.textContent=label;tlbl.textContent="Отдых";
  clock.classList.remove("zero");
  dock.classList.add("up");
  clearInterval(tick);tick=setInterval(paintTimer,200);paintTimer();
}
function paintTimer(){
  const left=Math.max(0,endAt-Date.now())/1000;
  const m=Math.floor(left/60),s=Math.floor(left%60);
  clock.textContent=m+":"+pad(s);
  tfill.style.width=(total?Math.max(0,left/total*100):0)+"%";
  if(left<=0){
    clearInterval(tick);tick=null;
    clock.classList.add("zero");tlbl.textContent="Готово - следующий подход";
    if(navigator.vibrate)navigator.vibrate([120,70,120]);
    beep();
  }
}
function beep(){
  try{
    const a=new(window.AudioContext||window.webkitAudioContext)();
    const o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.frequency.value=760;o.type="sine";
    g.gain.setValueAtTime(.001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,a.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.5);
    o.start();o.stop(a.currentTime+.5);
  }catch(e){}
}
document.getElementById("skip").onclick=()=>{clearInterval(tick);tick=null;dock.classList.remove("up");};
document.getElementById("add30").onclick=()=>{
  if(!tick){endAt=Date.now();clock.classList.remove("zero");tlbl.textContent="Отдых";tick=setInterval(paintTimer,200);}

};

  ver.style.cssText="margin-top:12px;text-align:center;font-size:12.5px;color:var(--muted);opacity:.7;";
  foot.appendChild(ver);
  main.appendChild(foot);
  main.insertAdjacentHTML("beforeend",rulesHTML());
  updateProgress();
}

const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
const ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';

function exCard(e,i){
  const card=el("div","ex"+(openPanels[cur+"|"+i]?" hopen":""));card.dataset.i=i;
  const perSide=e.side?" на сторону":"";
  const unit=e.sec?" сек":"";
  card.innerHTML=
    '<div class="exhead"><div class="num">'+(i+1)+'</div><div class="exinfo">'+
    '<div class="exname">'+esc(e.n)+'</div>'+
    '<div class="extags"><b>'+e.s+'×'+e.r+unit+perSide+'</b> · '+esc(e.t)+' · отдых '+fmt(e.rest)+
    (e.hint?' <br>'+esc(e.hint):'')+'</div></div></div>';

  const ls=lastSession(cur,i);
  const all=(state.hist[cur+"|"+i]||[]).filter(r=>r.d<sessDate());
  const ll=el("button","lastline"+(ls?"":" empty"));
  if(ls){
    ll.innerHTML='<div class="ll"><b>Прошлый раз '+shortDate(ls.d)+'</b> · '+
      (ls.s&&ls.s.length?ls.s.map(x=>chipTxt(e,x)).join(" · "):"лучший "+chipTxt(e,[ls.w,ls.r])+" · "+ls.n+" подх.")+
      (e.w&&ls.v?' · <span style="opacity:.8">'+fmtN(ls.v)+' кг</span>':'')+'</div>'+CHEV;
    ll.onclick=()=>{
      const k=cur+"|"+i;openPanels[k]=!openPanels[k];
      card.classList.toggle("hopen",openPanels[k]);
      if(openPanels[k]&&!card.querySelector(".hpanel").childElementCount)fillPanel(card,e,i,all);
    };
    if(openPanels[cur+"|"+i]){const hp=el("div","hpanel");card.appendChild(ll);card.appendChild(hp);fillPanel(card,e,i,all);}
    else{card.appendChild(ll);card.appendChild(el("div","hpanel"));}
  }else{
    ll.innerHTML='<div class="ll">Первая тренировка по этому упражнению - истории пока нет</div>';
    ll.disabled=true;card.appendChild(ll);
  }
  const rd=readiness(e,ls);

    const r=el("div","ready"+(rd.ok?"":" hold"),(rd.ok?ARROW:"")+esc(rd.txt));
    r.style.margin="6px 12px 0 41px";card.appendChild(r);
  }
  const sets=el("div","sets");
  for(let j=0;j<e.s;j++)sets.appendChild(setRow(e,i,j,ls));

function fillPanel(card,e,i,all){
  const hp=card.querySelector(".hpanel");hp.innerHTML="";
  const recent=all.slice(-5).reverse();
  recent.forEach((rec,idx)=>{
    const prev=all[all.length-1-idx-1];
    let dv="";
    if(prev&&e.w&&rec.v){const d=rec.v-prev.v;dv='<span class="'+(d>0?"up":d<0?"down":"flat")+'">'+(d>0?"+":"")+fmtN(d)+'</span>';}
    const row=el("div","hrow",
      '<div class="hdate"><button class="hedit" aria-label="Изменить тренировку '+shortDate(rec.d)+'">'+shortDate(rec.d)+'<small>изменить</small></button></div><div class="hsets">'+setsHTML(e,rec)+
      (state.notes[cur+"|"+i]&&state.notes[cur+"|"+i][rec.d]?'<div class="hnote">'+esc(state.notes[cur+"|"+i][rec.d])+'</div>':'')+'</div>'+
      (e.w?'<div class="hvol"><b>'+fmtN(rec.v)+'</b>'+dv+'</div>':'<div class="hvol"><b>'+recReps(rec)+'</b>'+(e.sec?"сек":"повт")+'</div>'));
    row.querySelector(".hedit").onclick=()=>{openDate(rec.d);window.scrollTo({top:0,behavior:"smooth"});};
    hp.appendChild(row);
  });
  const nb=el("button","notebtn",logFor?"+ Заметка к тренировке "+shortDate(logFor):"+ Заметка к сегодняшней тренировке");
  nb.onclick=()=>{
    const k=cur+"|"+i,t=sessDate();
    const old=(state.notes[k]&&state.notes[k][t])||"";
    const txt=prompt("Заметка ("+e.n+"):",old);
    if(txt===null)return;
    if(!state.notes[k])state.notes[k]={};
    if(txt.trim())state.notes[k][t]=txt.trim();else delete state.notes[k][t];
    save();toast(txt.trim()?"Заметка сохранена":"Заметка удалена");
  };
  hp.appendChild(nb);
}

function setRow(e,i,j,ls){
  const d=slot(cur,i,j);
  const wrap=el("div","sset");
  const row=el("div","srow"+(d.d?" on":""));
  const lastW=state.last[cur+"|"+i];
  const px=ls&&ls.s?ls.s[j]:null;
  const lab=el("div","slabel",String(j+1));
  row.appendChild(lab);

  const wf=el("div","fld");
  if(e.w){
    const ph=px?trim(px[0]):(lastW||"–");
    wf.innerHTML='<input type="number" inputmode="decimal" step="0.5" placeholder="'+esc(ph)+'"><span>кг</span>';
    const wi=wf.querySelector("input");wi.value=d.w;
    wi.oninput=()=>{d.w=wi.value;if(!logFor)state.last[cur+"|"+i]=wi.value;touchSession(cur);if(d.d)recordHistory(cur,i);save();markBeat(row,e,d,px);updateLive();};
  }else{
    wf.innerHTML='<input type="text" value="Своё" disabled style="opacity:.45">';
  }
  row.appendChild(wf);

  const rf=el("div","fld");
  /* в поле всегда цель из программы, а прошлый результат подписан справа */
  rf.innerHTML='<input type="number" inputmode="numeric" placeholder="'+esc(e.r)+'">'+
    (px?'<span class="was">было <b>'+px[1]+(px[3]?"+"+px[3]:"")+'</b></span>':'<span>'+(e.sec?"сек":"пвт")+'</span>');
  if(px)rf.classList.add("hasw");
  const ri=rf.querySelector("input");ri.value=d.r;
  ri.oninput=()=>{d.r=ri.value;touchSession(cur);if(d.d)recordHistory(cur,i);save();markBeat(row,e,d,px);updateLive();if(d.d&&e.w)paintDropBtn(wrap,e,d);};
  row.appendChild(rf);

  const b=el("button","chk",'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>');
  b.setAttribute("aria-pressed",d.d);b.setAttribute("aria-label","Подход "+(j+1)+" выполнен");
  b.onclick=()=>{
    d.d=!d.d;
    if(d.d&&!d.r)d.r=px?String(px[1]):e.r.split("-")[0];
    if(d.d&&e.w&&!d.w){d.w=px?String(px[0]):(lastW||"");}
    recordHistory(cur,i);
    save();
    const isLast=(j===e.s-1);
    renderDay();
    if(d.d&&!logFor)startTimer(e.rest,isLast?nextExercise(i):e.n+" · подход "+(j+2)+" из "+e.s);
  };
  row.appendChild(b);
  markBeat(row,e,d,px);
  wrap.appendChild(row);
  if(e.w&&d.d){
    let lastDone=-1;for(let q=0;q<e.s;q++)if(slot(cur,i,q).d)lastDone=q;
    if(d.x)wrap.appendChild(dropRow(e,i,j,d,px));
    else if(j===lastDone||shortBy(e,d)||(px&&px[3]))wrap.appendChild(dropBtn(e,i,j,d,px));
  }
  return wrap;
}
/* добивка: после рабочего подхода сбросил вес и добрал недостающие повторы */
function shortBy(e,d){const r=parseFloat(d.r)||0,lo=range(e).lo;return r&&r<lo?lo-r:0;}
function dropSuggest(d,px){
  if(px&&px[3])return trim(px[2]);
  const w=parseFloat(d.w)||0;return w?trim(Math.max(0,Math.round(w*0.8/2.5)*2.5)):"";
}
function paintDropBtn(wrap,e,d){
  const btn=wrap.querySelector(".addx");if(!btn)return;
  const k=shortBy(e,d);
  btn.classList.toggle("need",!!k);
  btn.querySelector("b").textContent=k?" · не хватило "+k:"";
}
function dropBtn(e,i,j,d,px){
  const btn=el("button","addx","+ добивка меньшим весом<b></b>"+(px&&px[3]?'<span>было '+trim(px[2])+'×'+px[3]+'</span>':''));
  const k=shortBy(e,d);
  if(k){btn.classList.add("need");btn.querySelector("b").textContent=" · не хватило "+k;}
  btn.onclick=()=>{
    d.x={w:dropSuggest(d,px),r:""};save();renderDay();
    const ri=main.querySelector('.ex[data-i="'+i+'"] .drow[data-j="'+j+'"] .dr');if(ri)ri.focus();
  };
  return btn;
}
function dropRow(e,i,j,d,px){
  const row=el("div","drow");row.dataset.j=j;
  row.appendChild(el("div","slabel","↳"));
  const wf=el("div","fld");
  wf.innerHTML='<input type="number" inputmode="decimal" step="0.5" placeholder="'+esc(dropSuggest(d,px)||"–")+'"><span>кг</span>';
  const wi=wf.querySelector("input");wi.value=d.x.w;
  wi.oninput=()=>{d.x.w=wi.value;recordHistory(cur,i);save();updateLive();};
  row.appendChild(wf);
  const rf=el("div","fld");
  const k=shortBy(e,d);
  rf.innerHTML='<input class="dr" type="number" inputmode="numeric" placeholder="'+(k?"+"+k:"+")+'"><span>пвт</span>';
  const ri=rf.querySelector("input");ri.value=d.x.r;
  ri.oninput=()=>{d.x.r=ri.value;recordHistory(cur,i);save();updateLive();};
  row.appendChild(rf);
  const x=el("button","dx","×");x.setAttribute("aria-label","Убрать добивку");
  x.onclick=()=>{d.x=null;recordHistory(cur,i);save();renderDay();};
  row.appendChild(x);
  return row;
}
/* подсветка: подход лучше прошлого раза */
function markBeat(row,e,d,px){
  row.classList.toggle("short",!!(d.d&&shortBy(e,d)));
  if(!px||!d.d){row.classList.remove("beat");return;}
  const w=parseFloat(d.w)||0,r=parseFloat(d.r)||0;
  const beat=e.w?(w>px[0]||(w===px[0]&&r>px[1])):r>px[1];
  row.classList.toggle("beat",beat);
}

function nextExercise(i){
  const p=PROGRAM[cur];
  return p.ex[i+1]?("Дальше: "+p.ex[i+1].n):"Тренировка завершена";
}

function updateLive(){
  const p=PROGRAM[cur];if(!p)return;
  let vol=0,lastVol=0,reps=0;
  p.ex.forEach((e,i)=>{
    if(!e.w)return;
    for(let j=0;j<e.s;j++){const s=slot(cur,i,j);if(s.d){vol+=(parseFloat(s.w)||0)*(parseFloat(s.r)||0);reps+=parseFloat(s.r)||0;
      if(s.x)vol+=(parseFloat(s.x.w)||0)*(parseFloat(s.x.r)||0);}}
    const ls=lastSession(cur,i);if(ls)lastVol+=ls.v||0;
  });
  const a=document.getElementById("lv1"),b=document.getElementById("lv2");
  if(a)a.innerHTML='Тоннаж '+(logFor?shortDate(logFor):'сегодня')+': <b>'+fmtN(vol)+' кг</b>';
  if(b)b.innerHTML=lastVol?'Прошлый раз: <b>'+fmtN(lastVol)+' кг</b>':'';
}

function updateProgress(){
  const p=PROGRAM[cur];if(!p)return;
  let tot=0,done=0;
  p.ex.forEach((e,i)=>{
    let dn=0;
    for(let j=0;j<e.s;j++){tot++;if(slot(cur,i,j).d){done++;dn++;}}
    const card=main.querySelector('.ex[data-i="'+i+'"]');
    if(card&&dn===e.s)card.classList.add("complete");
  });
  const f=document.getElementById("fill"),c=document.getElementById("cnt");
  if(f)f.style.width=(tot?done/tot*100:0)+"%";
  if(c)c.textContent=done+" / "+tot+" подходов";
  updateLive();
}

/* ---------- charts (SVG, без библиотек) ---------- */
function niceTicks(mn,mx,n){
  if(mx===mn){const p=mn===0?1:Math.abs(mn)*.1;mn-=p;mx+=p;}
  const span=mx-mn,raw=span/(n-1),mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const norm=raw/mag;let step=mag*(norm<1.5?1:norm<3?2:norm<7?5:10);
  const lo=Math.floor(mn/step)*step,hi=Math.ceil(mx/step)*step;
  const t=[];for(let v=lo;v<=hi+step*1e-6;v+=step)t.push(+v.toFixed(6));
  return {lo:lo,hi:hi,ticks:t};
}
function tipFor(host){
  let t=host.querySelector(".tip");
  if(!t){t=el("div","tip");host.appendChild(t);}
  return t;
}
function placeTip(host,t,xPx,html){
  t.innerHTML=html;t.classList.add("show");
  const hw=host.clientWidth,tw=t.offsetWidth;
  const x=Math.max(tw/2+2,Math.min(hw-tw/2-2,xPx));
  t.style.left=x+"px";t.style.top="0px";
}
function svgEl(n,attrs){const x=document.createElementNS("http://www.w3.org/2000/svg",n);for(const k in attrs)x.setAttribute(k,attrs[k]);return x;}

/* Линия по сессиям: pts=[{x:'2026-09-09', y:100, sub:'html', pr:false}] */
function lineChart(host,pts,opts){
  opts=opts||{};host.innerHTML="";
  if(pts.length<2){host.appendChild(el("div","pempty","Нужно минимум две тренировки для графика"));return;}
  const W=340,H=150,PL=36,PR=14,PT=18,PB=22;
  const ys=pts.map(p=>p.y);
  const nt=niceTicks(Math.min(...ys),Math.max(...ys),4);
  const sx=i=>PL+i*((W-PL-PR)/(pts.length-1));
  const sy=v=>PT+(H-PT-PB)*(1-(v-nt.lo)/((nt.hi-nt.lo)||1));
  const svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,role:"img"});
  nt.ticks.forEach(v=>{
    svg.appendChild(svgEl("line",{x1:PL,x2:W-PR,y1:sy(v),y2:sy(v),class:"grid"}));
    const tx=svgEl("text",{x:PL-6,y:sy(v)+3.5,"text-anchor":"end",class:"ax"});tx.textContent=fmtK(v);svg.appendChild(tx);
  });
  const step=Math.max(1,Math.ceil(pts.length/4));
  pts.forEach((p,i)=>{
    if(i%step===0||i===pts.length-1){
      const tx=svgEl("text",{x:sx(i),y:H-6,"text-anchor":i===0?"start":i===pts.length-1?"end":"middle",class:"ax"});
      tx.textContent=shortDate(p.x);svg.appendChild(tx);
    }
  });
  const line=pts.map((p,i)=>(i?"L":"M")+sx(i).toFixed(1)+","+sy(p.y).toFixed(1)).join(" ");
  const base=sy(nt.lo);
  svg.appendChild(svgEl("path",{d:line+" L"+sx(pts.length-1).toFixed(1)+","+base+" L"+sx(0).toFixed(1)+","+base+" Z",class:"ar"}));
  svg.appendChild(svgEl("path",{d:line,class:"ln"}));
  const cross=svgEl("line",{x1:0,x2:0,y1:PT,y2:H-PB,class:"cross"});svg.appendChild(cross);
  pts.forEach((p,i)=>svg.appendChild(svgEl("circle",{cx:sx(i),cy:sy(p.y),r:4,class:"dot"+(p.pr?" pr":"")})));
  const lastP=pts[pts.length-1];
  const endl=svgEl("text",{x:sx(pts.length-1),y:sy(lastP.y)-9,"text-anchor":"end",class:"endl"});
  endl.textContent=(opts.fmt||trim)(lastP.y)+(opts.unit?" "+opts.unit:"");svg.appendChild(endl);
  const hit=svgEl("rect",{x:PL-10,y:0,width:W-PL-PR+20,height:H,class:"hit"});svg.appendChild(hit);
  host.appendChild(svg);
  const tip=tipFor(host);
  let sel=-1;
  const show=i=>{
    if(i===sel)return;sel=i;
    const p=pts[i],xv=sx(i);
    cross.setAttribute("x1",xv);cross.setAttribute("x2",xv);cross.style.opacity=1;
    svg.querySelectorAll(".dot").forEach((d,k)=>d.setAttribute("r",k===i?5.5:4));
    const rect=svg.getBoundingClientRect();
    placeTip(host,tip,xv*rect.width/W,'<b>'+(opts.fmt||trim)(p.y)+(opts.unit?" "+opts.unit:"")+'</b>'+shortDate(p.x)+(p.pr?' · <span class="up">рекорд</span>':'')+(p.sub?'<span class="ts">'+p.sub+'</span>':''));
  };
  const onMove=ev=>{
    const rect=svg.getBoundingClientRect();
    const x=(ev.clientX-rect.left)*W/rect.width;
    let best=0,bd=1e9;
    pts.forEach((p,i)=>{const d=Math.abs(sx(i)-x);if(d<bd){bd=d;best=i;}});
    show(best);
  };
  hit.addEventListener("pointerdown",ev=>{onMove(ev);});
  hit.addEventListener("pointermove",ev=>{if(ev.pointerType==="mouse"||ev.buttons)onMove(ev);});
  show(pts.length-1);
}

/* Столбики: bars=[{x:'label', y:v, sub:'html', dim:bool}] */
function barChart(host,bars,opts){
  opts=opts||{};host.innerHTML="";
  if(!bars.length){host.appendChild(el("div","pempty","Данных пока нет"));return;}
  const W=340,H=140,PL=36,PR=8,PT=14,PB=22;
  const mx=Math.max(...bars.map(b=>b.y),1);
  const nt=niceTicks(0,mx,4);
  const slot=(W-PL-PR)/bars.length,bw=Math.min(24,slot*.62);
  const sy=v=>PT+(H-PT-PB)*(1-v/(nt.hi||1));
  const svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,role:"img"});
  nt.ticks.forEach(v=>{
    svg.appendChild(svgEl("line",{x1:PL,x2:W-PR,y1:sy(v),y2:sy(v),class:"grid"}));
    const tx=svgEl("text",{x:PL-6,y:sy(v)+3.5,"text-anchor":"end",class:"ax"});tx.textContent=fmtK(v);svg.appendChild(tx);
  });
  const base=sy(0),r=4;
  const rects=[];
  bars.forEach((b,i)=>{
    const x=PL+slot*i+(slot-bw)/2,y=b.y>0?sy(b.y):base;
    const h=base-y;
    let d;
    if(h<=r)d="M"+x+","+base+" L"+x+","+y+" L"+(x+bw)+","+y+" L"+(x+bw)+","+base+" Z";
    else d="M"+x+","+base+" L"+x+","+(y+r)+" Q"+x+","+y+" "+(x+r)+","+y+" L"+(x+bw-r)+","+y+" Q"+(x+bw)+","+y+" "+(x+bw)+","+(y+r)+" L"+(x+bw)+","+base+" Z";
    const p=svgEl("path",{d:d,class:"bar"+(b.dim?" dim":"")});svg.appendChild(p);rects.push(p);
    if(bars.length<=12||i%2===0||i===bars.length-1){
      const tx=svgEl("text",{x:x+bw/2,y:H-6,"text-anchor":"middle",class:"ax"});tx.textContent=b.x;svg.appendChild(tx);
    }
  });
  const hit=svgEl("rect",{x:PL,y:0,width:W-PL-PR,height:H,class:"hit"});svg.appendChild(hit);
  host.appendChild(svg);
  const tip=tipFor(host);
  let sel=-1;
  const show=i=>{
    if(i===sel)return;sel=i;
    rects.forEach((p,k)=>p.classList.toggle("hot",k===i));
    const b=bars[i],rect=svg.getBoundingClientRect();
    const cx=PL+slot*i+slot/2;
    placeTip(host,tip,cx*rect.width/W,'<b>'+(opts.fmt||fmtN)(b.y)+(opts.unit?" "+opts.unit:"")+'</b>'+(b.sub||""));
  };
  const onMove=ev=>{
    const rect=svg.getBoundingClientRect();
    const x=(ev.clientX-rect.left)*W/rect.width;
    show(Math.max(0,Math.min(bars.length-1,Math.floor((x-PL)/slot))));
  };
  hit.addEventListener("pointerdown",onMove);
  hit.addEventListener("pointermove",ev=>{if(ev.pointerType==="mouse"||ev.buttons)onMove(ev);});
  let init=bars.length-1;while(init>0&&!bars[init].y)init--;show(init);
}

function spark(vals){
  if(vals.length<2)return "";
  const W=86,H=30,P=3;
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1;
  const pts=vals.map((v,i)=>{
    const x=P+i*((W-P*2)/(vals.length-1));
    const y=H-P-((v-mn)/rng)*(H-P*2);
    return x.toFixed(1)+","+y.toFixed(1);
  });
  const col=vals[vals.length-1]>=vals[0]?"#48B58C":"#D96A5B";
  const [lx,ly]=pts[pts.length-1].split(",");
  return '<svg class="spark" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+
    '<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+lx+'" cy="'+ly+'" r="3" fill="'+col+'" stroke="#1B3242" stroke-width="2"/></svg>';
}

/* ---------- аналитика ---------- */
function allRecords(){
  const out=[];
  DAY_IDS.forEach(day=>PROGRAM[day].ex.forEach((e,i)=>{
    (state.hist[day+"|"+i]||[]).forEach(r=>out.push({day:day,i:i,e:e,r:r}));
  }));
  return out;
}
/* по датам: тоннаж, подходы, повторы, день программы */
function byDate(){
  const m={};
  allRecords().forEach(x=>{
    const o=m[x.r.d]||(m[x.r.d]={d:x.r.d,day:x.day,v:0,n:0,reps:0,ex:0});
    o.v+=x.r.v||0;o.n+=x.r.n||0;o.reps+=recReps(x.r);o.ex++;
  });
  return m;
}
function weekStats(dates){
  const w={};
  Object.values(dates).forEach(o=>{
    const k=weekStart(o.d);
    const x=w[k]||(w[k]={k:k,v:0,n:0,days:0});
    x.v+=o.v;x.n+=o.n;x.days++;
  });
  return w;
}
function computePRs(){
  const ev=[];
  DAY_IDS.forEach(day=>PROGRAM[day].ex.forEach((e,i)=>{
    const arr=state.hist[day+"|"+i]||[];
    let mw=-1,me=-1,mv=-1;
    arr.forEach((r,idx)=>{
      const e1=recE1(r);
      if(idx>0){
        if(e.w&&r.w>mw&&r.w>0)ev.push({d:r.d,n:e.n,t:"вес",val:trim(r.w)+" кг",prev:trim(mw)+" кг"});
        else if(e.w&&e1>me&&e1>0)ev.push({d:r.d,n:e.n,t:"1ПМ",val:trim(e1)+" кг",prev:trim(me)+" кг"});
        else if(e.w&&r.v>mv&&r.v>0)ev.push({d:r.d,n:e.n,t:"объём",val:fmtN(r.v)+" кг",prev:fmtN(mv)+" кг"});
        else if(!e.w&&r.r>mw)ev.push({d:r.d,n:e.n,t:e.sec?"время":"повторы",val:r.r+(e.sec?" сек":""),prev:mw+(e.sec?" сек":"")});
      }
      mw=Math.max(mw,e.w?r.w:r.r);me=Math.max(me,e1);mv=Math.max(mv,r.v);
    });
  }));
  ev.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0);
  return ev;
}
function streakWeeks(weeks){
  let k=weekStart(todayKey()),n=0;
  if(!weeks[k])k=addDays(k,-7);
  while(weeks[k]){n++;k=addDays(k,-7);}
  return n;
}

  const prs=computePRs();
  const recentPR=prs.filter(p=>daysBetween(p.d,t)<=14).length;
  const streak=streakWeeks(weeks);
  const since=daysBetween(dlist[dlist.length-1],t);

    c.onclick=()=>{
      grid.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));c.classList.add("sel");

      const s=state.sess[d];
      info.innerHTML='<b>'+wd+' '+shortDate(d)+' · '+esc(PROGRAM[o.day].name)+'</b> · '+fmtN(o.v)+' кг · '+o.n+' подходов · '+o.ex+' упр.'+(s&&s.t1>s.t0?' · '+fmtDur(s.t1-s.t0):'');

  main.appendChild(hc);

  /* рекорды */
  const pc=el("div","card",'<div class="chead"><div><h4>Последние рекорды</h4><div class="sub">Вес, расчётный 1ПМ или объём выше всех прошлых</div></div></div>');

    if(growth.length>5){
      const worst=growth.slice(-2).filter(g=>g.p<=0);
      worst.forEach(g=>gc.appendChild(el("div","prrow",'<div class="pn">'+esc(g.n)+'<small>'+g.from+' → '+g.to+' кг за '+g.d+' дн. · отстаёт</small></div><div class="pv '+(g.p<0?"down":"flat")+'">'+g.p+'%</div>')));
    }
    main.appendChild(gc);
  }
}

    {id:"w",lbl:"Вес",f:r=>r.w,unit:"кг"},

    {id:"r",lbl:e.sec?"Лучший, сек":"Лучший подход",f:r=>r.r,unit:e.sec?"сек":""},
    {id:"reps",lbl:"Всего за тренировку",f:r=>recReps(r),unit:e.sec?"сек":""}

}
const metricSel={};

function progressCard(day,e,i,arr){
  const k=day+"|"+i;
  const cur_=arr[arr.length-1], prev=arr.length>1?arr[arr.length-2]:null;
  const card=el("div","pex"+(openCards[k]?" open":""));
  let delta='<span class="pdelta flat">первая запись</span>';
  if(prev){
    const dw=cur_.w-prev.w, dv=cur_.v-prev.v, dr=recReps(cur_)-recReps(prev);
    let m;
    if(e.w&&dw>0)m='<span class="up">+'+trim(dw)+' кг</span>';
    else if(e.w&&dw<0)m='<span class="down">'+trim(dw)+' кг</span>';
    else if(cur_.r>prev.r)m='<span class="up">+'+(cur_.r-prev.r)+(e.sec?" сек":" повт.")+'</span>';
    else if(cur_.r<prev.r)m='<span class="down">'+(cur_.r-prev.r)+(e.sec?" сек":" повт.")+'</span>';
    else m='<span class="flat">тот же вес</span>';
    const sub=e.w?'объём '+(dv>0?"+":"")+fmtN(dv)+' кг':'всего '+(dr>0?"+":"")+dr;
    delta='<span class="pdelta">'+m+'<small>'+sub+'</small></span>';
  }
  const val=e.w
    ? '<div class="pnow">'+trim(cur_.w)+'<small>кг × '+cur_.r+'</small></div>'
    : '<div class="pnow">'+cur_.r+'<small>'+(e.sec?"сек":"повт")+'</small></div>';
  const sp=spark(arr.slice(-8).map(r=>e.w?recE1(r):recReps(r)));
  const rd=readiness(e,cur_);
  const head=el("button","phead",
    '<div class="pname">'+esc(e.n)+'</div>'+
    '<div class="pline">'+val+delta+sp+'</div>'+
    '<div class="plast"><b>'+shortDate(cur_.d)+(cur_.d===todayKey()?" (сегодня)":"")+'</b></div>'+
    (rd?'<div class="ready'+(rd.ok?"":" hold")+'">'+(rd.ok?ARROW:"")+esc(rd.txt)+'</div>':''));
  head.querySelector(".plast").appendChild(el("div",null,setsHTML(e,cur_)));
  head.onclick=()=>{
    openCards[k]=!openCards[k];card.classList.toggle("open",openCards[k]);
    if(openCards[k]&&!body.childElementCount)fillBody();
  };
  card.appendChild(head);
  const body=el("div","pbody");card.appendChild(body);
  function fillBody(){
    body.innerHTML="";
    const ms=metricsFor(e);
    if(!metricSel[k])metricSel[k]=ms[0].id;
    const chips=el("div","mchips");
    ms.forEach(m=>{
      const b=el("button","mchip",m.lbl);b.setAttribute("aria-pressed",metricSel[k]===m.id);
      b.onclick=()=>{metricSel[k]=m.id;chips.querySelectorAll(".mchip").forEach(x=>x.setAttribute("aria-pressed",x===b));draw();};
      chips.appendChild(b);
    });
    body.appendChild(chips);
    const ch=el("div","chart");body.appendChild(ch);
    function draw(){
      const m=ms.find(x=>x.id===metricSel[k]);
      let mx=-Infinity;
      const pts=arr.map((r,idx)=>{
        const y=m.f(r);const pr=idx>0&&y>mx&&y>0;mx=Math.max(mx,y);
        return {x:r.d,y:y,pr:pr,sub:r.s&&r.s.length?r.s.map(x=>chipTxt(e,x)).join(" · "):("лучший "+chipTxt(e,[r.w,r.r])+" · "+r.n+" подх.")};
      });
      lineChart(ch,pts,{unit:m.unit,fmt:m.fmt||trim});
    }
    draw();
    /* рекорды */
    let bw=null,be=null,bv=null;
    arr.forEach(r=>{
      if(!bw||r.w>bw.w||(r.w===bw.w&&r.r>bw.r))bw=r;
      const e1=recE1(r);if(!be||e1>be.e1)be={e1:e1,d:r.d};
      if(!bv||r.v>bv.v)bv=r;
    });
    const rec=e.w
      ?'Рекорды: <b>'+trim(bw.w)+'×'+bw.r+'</b> ('+shortDate(bw.d)+') · 1ПМ <b>'+trim(be.e1)+' кг</b> ('+shortDate(be.d)+') · объём <b>'+fmtN(bv.v)+' кг</b> ('+shortDate(bv.d)+')'
      :'Рекорд: <b>'+bw.r+(e.sec?" сек":" повт.")+'</b> ('+shortDate(bw.d)+') · всего за тренировку <b>'+Math.max(...arr.map(recReps))+'</b>';
    body.appendChild(el("div","prec",rec+' · тренировок: <b>'+arr.length+'</b>'));
    /* все сессии */
    const sl=el("div","sesslist",'<div class="sesshead">Все тренировки · подходы</div>');
    arr.slice().reverse().forEach((r,idx)=>{
      const pv=arr[arr.length-2-idx];
      let dv="";
      if(pv&&e.w&&r.v){const d=r.v-pv.v;dv='<span class="'+(d>0?"up":d<0?"down":"flat")+'">'+(d>0?"+":"")+fmtN(d)+'</span>';}
      const note=state.notes[k]&&state.notes[k][r.d];
      sl.appendChild(el("div","hrow",'<div class="hdate">'+shortDate(r.d)+'</div><div class="hsets">'+setsHTML(e,r)+(note?'<div class="hnote">'+esc(note)+'</div>':'')+'</div>'+
        (e.w?'<div class="hvol"><b>'+fmtN(r.v)+'</b>'+dv+'</div>':'<div class="hvol"><b>'+recReps(r)+'</b>'+(e.sec?"сек":"повт")+'</div>')));
    });
    body.appendChild(sl);
    const legacy=arr.some(r=>!r.s);
    if(legacy)body.appendChild(el("div","pempty","Записи до 28.09 хранят только лучший подход - раскладка по подходам копится с этой версии."));
  }
  if(openCards[k])fillBody();
  return card;
}

  cloudSync();
})();
</script>
