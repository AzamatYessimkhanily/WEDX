<title>Программа тренировок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#132430;
    --surface:#1B3242;
    --surface-2:#22404F;
    --line:#2E5164;
    --amber:#F0B429;
    --amber-dim:#8A6816;
    --done:#48B58C;
    --text:#E8F0F4;
    --muted:#8DA9B8;
    --danger:#D96A5B;
    --r:10px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Barlow Semi Condensed','Roboto Condensed',system-ui,-apple-system,sans-serif;
    font-size:17px;
    line-height:1.35;
    font-variant-numeric:tabular-nums;
    padding-bottom:190px;
    overscroll-behavior-y:contain;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 14px;}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:40;
    background:rgba(19,36,48,.96);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding-top:env(safe-area-inset-top);
  }
  .htop{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 8px;}
  .htop h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.2px;white-space:nowrap;}
  .htop .sub{font-size:14px;color:var(--muted);}
  .progbtn{
    background:transparent;border:1px solid var(--line);color:var(--muted);
    font-family:inherit;font-size:14.5px;font-weight:600;padding:6px 13px;
    border-radius:99px;cursor:pointer;
  }
  .progbtn.on{background:var(--amber);border-color:var(--amber);color:#12222C;}
  .progbtn:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  .pgroup{margin-top:18px;}
  .pgroup h3{font-size:17px;margin:0 0 8px;font-weight:600;color:var(--amber);}
  .pex{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
    padding:11px 12px;margin-bottom:8px;
  }
  .pname{font-size:16px;font-weight:600;line-height:1.2;}
  .pline{display:flex;align-items:flex-end;gap:12px;margin-top:9px;}
  .pnow{font-size:27px;font-weight:700;line-height:1;}
  .pnow small{font-size:14px;font-weight:500;color:var(--muted);margin-left:3px;}
  .pdelta{font-size:15px;font-weight:600;padding-bottom:2px;}
  .up{color:var(--done);}
  .down{color:var(--danger);}
  .flat{color:var(--muted);}
  .spark{margin-left:auto;flex-shrink:0;}
  .phist{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.5;}
  .pempty{color:var(--muted);font-size:14.5px;margin-top:7px;}
  .days{display:flex;gap:6px;padding-bottom:10px;}
  .day{
    flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:var(--r);padding:8px 4px;cursor:pointer;font-family:inherit;
    font-size:15px;font-weight:600;line-height:1.15;text-align:center;transition:.12s;
  }
  .day small{display:block;font-size:12px;font-weight:400;opacity:.8;margin-top:2px;}
  .day[aria-selected="true"]{background:var(--amber);border-color:var(--amber);color:#12222C;}
  .day:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}

  /* ---------- day meta ---------- */
  .daymeta{display:flex;align-items:center;gap:10px;padding:14px 0 6px;}
  .daymeta h2{font-size:19px;margin:0;font-weight:600;flex:1;}
  .bar{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-bottom:14px;}
  .bar i{display:block;height:100%;background:var(--done);width:0;transition:width .25s;}
  .count{font-size:15px;color:var(--muted);white-space:nowrap;}

  /* ---------- exercise ---------- */
  .ex{
    background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r);margin-bottom:10px;overflow:hidden;
  }
  .ex.complete{border-color:var(--done);}
  .exhead{display:flex;gap:10px;padding:11px 12px;align-items:flex-start;}
  .num{
    font-size:15px;font-weight:700;color:var(--muted);
    min-width:19px;padding-top:1px;
  }
  .ex.complete .num{color:var(--done);}
  .exinfo{flex:1;min-width:0;}
  .exname{font-size:17px;font-weight:600;line-height:1.2;}
  .extags{font-size:13.5px;color:var(--muted);margin-top:3px;}
  .extags b{color:var(--amber);font-weight:600;}

  .sets{padding:0 12px 11px;}
  .srow{
    display:grid;grid-template-columns:22px 1fr 1fr 46px;
    gap:7px;align-items:center;margin-top:7px;
  }
  .slabel{font-size:14px;color:var(--muted);text-align:center;}
  .fld{position:relative;}
  .fld input{
    width:100%;background:var(--surface-2);border:1px solid transparent;
    color:var(--text);font-family:inherit;font-size:17px;font-weight:600;
    border-radius:8px;padding:9px 30px 9px 9px;
    -moz-appearance:textfield;
  }
  .fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .fld input:focus{outline:none;border-color:var(--amber);}
  .fld span{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    font-size:12.5px;color:var(--muted);pointer-events:none;
  }
  .chk{
    height:38px;border-radius:8px;border:1px solid var(--line);
    background:transparent;cursor:pointer;color:var(--muted);
    display:flex;align-items:center;justify-content:center;transition:.12s;
  }
  .chk svg{width:19px;height:19px;}
  .chk[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:#0F2620;}
  .chk:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .srow.on .fld input{background:rgba(72,181,140,.13);color:var(--done);}
  .srow.on .slabel{color:var(--done);}

  /* ---------- timer dock ---------- */
  .dock{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    background:var(--surface);border-top:1px solid var(--line);
    padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    transform:translateY(105%);transition:transform .22s ease;
  }
  .dock.up{transform:translateY(0);}
  .dockin{max-width:560px;margin:0 auto;}
  .dtop{display:flex;align-items:center;gap:12px;}
  .clock{
    font-size:52px;font-weight:700;line-height:.9;letter-spacing:-1px;
    color:var(--amber);min-width:118px;
  }
  .clock.zero{color:var(--done);}
  .dnext{flex:1;min-width:0;}
  .dnext .lbl{font-size:13px;color:var(--muted);}
  .dnext .val{font-size:16px;font-weight:600;line-height:1.2;margin-top:2px;}
  .dbtns{display:flex;gap:7px;margin-top:10px;}
  .dbtns button{
    flex:1;padding:11px 6px;border-radius:8px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--text);font-family:inherit;
    font-size:15.5px;font-weight:600;cursor:pointer;
  }
  .dbtns button.main{background:var(--amber);border-color:var(--amber);color:#12222C;}
  .dbtns button:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
  .tbar{height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin-top:9px;}
  .tbar i{display:block;height:100%;background:var(--amber);width:100%;}

  /* ---------- rest ---------- */
  .restday{
    text-align:center;padding:46px 20px;color:var(--muted);
    border:1px dashed var(--line);border-radius:var(--r);
  }
  .restday b{display:block;color:var(--text);font-size:19px;margin-bottom:6px;}
  .foot{padding:20px 0 8px;}
  .foot button{
    width:100%;padding:12px;border-radius:var(--r);border:1px solid var(--line);
    background:transparent;color:var(--muted);font-family:inherit;font-size:15.5px;cursor:pointer;
  }
  .rules{margin-top:16px;border-top:1px solid var(--line);padding-top:14px;}
  .rules summary{cursor:pointer;font-size:16px;font-weight:600;color:var(--muted);padding:6px 0;}
  .rules ol{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:15.5px;}
  .rules li{margin-bottom:7px;}
  .rules b{color:var(--text);font-weight:600;}
  .vol{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px;}
  .vol td{padding:5px 0;border-bottom:1px solid var(--line);color:var(--muted);}
  .vol td:last-child{text-align:right;color:var(--text);font-weight:600;}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="htop">
      <h1>Программа</h1>
      <button id="tab-prog" class="progbtn">Прогресс</button>
    </div>
    <div class="days" id="days" role="tablist"></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="dock" id="dock">
  <div class="dockin">
    <div class="dtop">
      <div class="clock" id="clock">0:00</div>
      <div class="dnext">
        <div class="lbl" id="tlbl">Отдых</div>
        <div class="val" id="tval"></div>
      </div>
    </div>
    <div class="tbar"><i id="tfill"></i></div>
    <div class="dbtns">
      <button id="add30">+30 сек</button>
      <button id="skip" class="main">Пропустить</button>
    </div>
  </div>
</div>

<script>
const PROGRAM = {
  mon:{name:"Верх A", note:"Жимовой акцент", ex:[
    {n:"Жим гантелей лёжа", t:"Грудь, средний участок", s:4, r:"6-8", rest:150, w:1, hint:"Штанга через 6-8 недель"},
    {n:"Вертикальная тяга широким хватом", t:"Широчайшие, ширина", s:4, r:"8-10", rest:120, w:1},
    {n:"Жим гантелей на наклонной 30-45°", t:"Грудь, ключичная головка", s:3, r:"8-12", rest:105, w:1},
    {n:"Горизонтальная тяга в тренажёре", t:"Широчайшие, ромбовидные", s:3, r:"8-12", rest:90, w:1, side:1},
    {n:"Махи гантелями в стороны", t:"Средняя дельта", s:3, r:"12-15", rest:60, w:1},
    {n:"Разгибания на трицепс, блок", t:"Трицепс, латеральная + медиальная", s:3, r:"10-12", rest:75, w:1},
    {n:"Молот", t:"Брахиалис, брахиорадиалис", s:3, r:"10-12", rest:75, w:1},
    {n:"Планка", t:"Кор, антиразгибание", s:3, r:"40", rest:45, w:0, sec:1}
  ]},
  wed:{name:"Низ A", note:"Квадрицепс-доминант", ex:[
    {n:"Гакк-присед", t:"Квадрицепс, ягодичные", s:4, r:"8-10", rest:150, w:1},
    {n:"Жим ногами", t:"Квадрицепс", s:3, r:"10-12", rest:120, w:1},
    {n:"Болгарский сплит-присед с весом", t:"Ягодичные, квадрицепс", s:3, r:"8-10", rest:120, w:1, side:1},
    {n:"Разгибания ног сидя", t:"Прямая мышца бедра", s:3, r:"12-15", rest:75, w:1},
    {n:"Подъёмы на носки стоя", t:"Икроножная", s:4, r:"12-15", rest:60, w:1},
    {n:"Скручивания на блоке", t:"Прямая мышца живота", s:3, r:"12-15", rest:60, w:1}
  ]},
  fri:{name:"Верх B", note:"Тяговый акцент", ex:[
    {n:"Тяга штанги в наклоне к поясу", t:"Толщина спины, средняя трапеция", s:4, r:"8-10", rest:150, w:1},
    {n:"Жим на плечи в тренажёре", t:"Передняя + средняя дельта", s:4, r:"6-8", rest:150, w:1},
    {n:"Подтягивания / тяга обратным хватом", t:"Низ широчайших, бицепс", s:3, r:"8-10", rest:120, w:1},
    {n:"Брусья с наклоном вперёд", t:"Грудь, нижний участок", s:3, r:"8-12", rest:105, w:1, hint:"Первые 4-6 недель без веса"},
    {n:"Бабочка", t:"Грудь, полное приведение", s:3, r:"10-12", rest:75, w:1, hint:"Пауза 1 сек в точке сведения"},
    {n:"Обратная бабочка", t:"Задняя дельта", s:3, r:"12-15", rest:60, w:1},
    {n:"Подъём гантелей сидя с супинацией, в наклоне", t:"Бицепс, длинная головка", s:3, r:"8-12", rest:75, w:1},
    {n:"Разгибание гантели над головой", t:"Трицепс, длинная головка", s:3, r:"10-12", rest:75, w:1},
    {n:"Шраги", t:"Верхняя трапеция", s:2, r:"12-15", rest:60, w:1}
  ]},
  sun:{name:"Низ B", note:"Задняя цепь", ex:[
    {n:"Гиперэкстензия с весом", t:"Разгибатели, бицепс бедра, ягодичные", s:4, r:"10-12", rest:120, w:1, hint:"Румынская тяга через 4-6 недель"},
    {n:"Сгибания ног лёжа", t:"Бицепс бедра, сгибание колена", s:4, r:"10-12", rest:90, w:1},
    {n:"Выпады с гантелями", t:"Ягодичные, квадрицепс", s:3, r:"10", rest:105, w:1, side:1},
    {n:"Подъёмы на носки сидя", t:"Камбаловидная", s:4, r:"15-20", rest:60, w:1},
    {n:"Боковая планка", t:"Косые, латеральная стабилизация", s:3, r:"30", rest:45, w:0, sec:1, side:1}
  ]}
};
const DAYS=[
  {id:"mon",lbl:"Пн",sub:"Верх A"},{id:"tue",lbl:"Вт",sub:"Отдых"},
  {id:"wed",lbl:"Ср",sub:"Низ A"},{id:"thu",lbl:"Чт",sub:"Отдых"},
  {id:"fri",lbl:"Пт",sub:"Верх B"},{id:"sat",lbl:"Сб",sub:"Отдых"},
  {id:"sun",lbl:"Вс",sub:"Низ B"}
];
const VOLUME=[["Спина",14],["Грудь",13],["Квадрицепс",13],["Ягодичные",10],["Кор",9],["Задняя поверхность",8],["Икры",8],["Дельта средняя",6],["Бицепс",6],["Трицепс",6],["Дельта передняя",4],["Дельта задняя",3],["Трапеция",2]];

const KEY="gym-log-v1";
let state={log:{},last:{}};
let cur=DAYS[[6,0,1,2,3,4,5][new Date().getDay()]].id;
if(!PROGRAM[cur]) cur="mon";

/* ---------- storage ---------- */
let storageOK=true;
function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r)state=JSON.parse(r);
  }catch(e){storageOK=false;}
  if(!state.log)state.log={};
  if(!state.last)state.last={};
  if(!state.done)state.done={};
}
let saveT=null;
function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    try{localStorage.setItem(KEY,JSON.stringify(state));}
    catch(e){storageOK=false;}
  },300);
}
function slot(day,i,j){
  const k=day+"|"+i;
  if(!state.log[k])state.log[k]=[];
  if(!state.log[k][j])state.log[k][j]={w:"",r:"",d:false};
  return state.log[k][j];
}

/* ---------- history ---------- */
function todayKey(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function recordHistory(day,i){
  const e=PROGRAM[day].ex[i], k=day+"|"+i, sets=state.log[k]||[];
  let best=null, vol=0, n=0;
  for(let j=0;j<e.s;j++){
    const s=sets[j];
    if(!s||!s.d)continue;
    n++;
    const w=parseFloat(s.w)||0, r=parseFloat(s.r)||0;
    vol+=w*r;
    if(!best||w>best.w||(w===best.w&&r>best.r))best={w:w,r:r};
  }
  if(!state.hist)state.hist={};
  if(!state.hist[k])state.hist[k]=[];
  const arr=state.hist[k], t=todayKey();
  const rec={d:t,w:best?best.w:0,r:best?best.r:0,v:Math.round(vol),n:n};
  const last=arr[arr.length-1];
  if(n===0){ if(last&&last.d===t)arr.pop(); return; }
  if(last&&last.d===t)arr[arr.length-1]=rec; else arr.push(rec);
  if(arr.length>40)arr.shift();
}

/* ---------- timer ---------- */
let endAt=0,total=0,tick=null,nextTxt="";
const dock=document.getElementById("dock"),clock=document.getElementById("clock"),
      tfill=document.getElementById("tfill"),tval=document.getElementById("tval"),
      tlbl=document.getElementById("tlbl");

function startTimer(sec,label){
  total=sec;endAt=Date.now()+sec*1000;nextTxt=label;
  tval.textContent=label;tlbl.textContent="Отдых";
  clock.classList.remove("zero");
  dock.classList.add("up");
  clearInterval(tick);tick=setInterval(paintTimer,200);paintTimer();
}
function paintTimer(){
  const left=Math.max(0,endAt-Date.now())/1000;
  const m=Math.floor(left/60),s=Math.floor(left%60);
  clock.textContent=m+":"+String(s).padStart(2,"0");
  tfill.style.width=(total?Math.max(0,left/total*100):0)+"%";
  if(left<=0){
    clearInterval(tick);tick=null;
    clock.classList.add("zero");tlbl.textContent="Готово - следующий подход";
    if(navigator.vibrate)navigator.vibrate([120,70,120]);
    beep();
  }
}
function beep(){
  try{
    const a=new(window.AudioContext||window.webkitAudioContext)();
    const o=a.createOscillator(),g=a.createGain();
    o.connect(g);g.connect(a.destination);o.frequency.value=760;o.type="sine";
    g.gain.setValueAtTime(.001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,a.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.5);
    o.start();o.stop(a.currentTime+.5);
  }catch(e){}
}
document.getElementById("skip").onclick=()=>{clearInterval(tick);tick=null;dock.classList.remove("up");};
document.getElementById("add30").onclick=()=>{
  if(!tick){endAt=Date.now();clock.classList.remove("zero");tlbl.textContent="Отдых";
    tick=setInterval(paintTimer,200);}
  endAt+=30000;total+=30;paintTimer();
};

/* ---------- render ---------- */
const main=document.getElementById("main");

function renderDays(){
  const c=document.getElementById("days");c.innerHTML="";
  DAYS.forEach(d=>{
    const b=document.createElement("button");
    b.className="day";b.setAttribute("role","tab");
    b.setAttribute("aria-selected",d.id===cur);
    b.innerHTML=d.lbl+"<small>"+d.sub+"</small>";
    b.onclick=()=>{cur=d.id;renderDays();renderDay();window.scrollTo({top:0});};
    c.appendChild(b);
  });
}

function renderDay(){
  main.innerHTML="";
  const p=PROGRAM[cur];
  if(!p){
    main.innerHTML='<div style="height:18px"></div><div class="restday"><b>День отдыха</b>Восстановление - это часть программы, а не пауза в ней.</div>'+rulesHTML();
    return;
  }
  const meta=document.createElement("div");
  meta.className="daymeta";
  meta.innerHTML='<h2>'+p.name+' <span style="color:var(--muted);font-weight:400">· '+p.note+'</span></h2><span class="count" id="cnt"></span>';
  main.appendChild(meta);
  const bar=document.createElement("div");bar.className="bar";bar.innerHTML='<i id="fill"></i>';
  main.appendChild(bar);

  p.ex.forEach((e,i)=>main.appendChild(exCard(e,i)));

  const foot=document.createElement("div");
  foot.className="foot";
  const btn=document.createElement("button");
  btn.textContent="Сбросить день (веса останутся)";
  btn.onclick=()=>{
    if(!confirm("Сбросить отметки и повторы за этот день?"))return;
    p.ex.forEach((e,i)=>{delete state.log[cur+"|"+i];});
    save();renderDay();
  };
  foot.appendChild(btn);

  const row=document.createElement("div");
  row.style.cssText="display:flex;gap:8px;margin-top:8px;";
  const exp=document.createElement("button");
  exp.textContent="Копия данных";
  exp.onclick=()=>{
    const txt=JSON.stringify(state);
    navigator.clipboard?.writeText(txt).then(
      ()=>alert("Данные скопированы в буфер. Сохрани в заметках - это резервная копия."),
      ()=>prompt("Скопируй вручную:",txt)
    );
  };
  const imp=document.createElement("button");
  imp.textContent="Восстановить";
  imp.onclick=()=>{
    const t=prompt("Вставь резервную копию:");
    if(!t)return;
    try{const o=JSON.parse(t);state=o;if(!state.log)state.log={};if(!state.last)state.last={};save();renderDay();}
    catch(e){alert("Не получилось прочитать. Проверь, что скопирован весь текст.");}
  };
  row.appendChild(exp);row.appendChild(imp);
  foot.appendChild(row);

  if(!storageOK){
    const w=document.createElement("div");
    w.style.cssText="margin-top:10px;padding:10px;border:1px solid var(--danger);border-radius:10px;color:var(--danger);font-size:14.5px;";
    w.textContent="Браузер не сохраняет данные. Скорее всего включён приватный режим - открой страницу в обычной вкладке.";
    foot.appendChild(w);
  }
  main.appendChild(foot);
  main.insertAdjacentHTML("beforeend",rulesHTML());
  updateProgress();
}

function exCard(e,i){
  const card=document.createElement("div");card.className="ex";card.dataset.i=i;
  const perSide=e.side?" на сторону":"";
  const unit=e.sec?" сек":"";
  card.innerHTML=
    '<div class="exhead"><div class="num">'+(i+1)+'</div><div class="exinfo">'+
    '<div class="exname">'+e.n+'</div>'+
    '<div class="extags"><b>'+e.s+'×'+e.r+unit+perSide+'</b> · '+e.t+' · отдых '+fmt(e.rest)+
    (e.hint?' <br>'+e.hint:'')+'</div></div></div>';
  const sets=document.createElement("div");sets.className="sets";
  for(let j=0;j<e.s;j++)sets.appendChild(setRow(e,i,j));
  card.appendChild(sets);
  return card;
}

function setRow(e,i,j){
  const d=slot(cur,i,j);
  const row=document.createElement("div");row.className="srow"+(d.d?" on":"");
  const lastW=state.last[cur+"|"+i];

  const lab=document.createElement("div");lab.className="slabel";lab.textContent=j+1;
  row.appendChild(lab);

  const wf=document.createElement("div");wf.className="fld";
  if(e.w){
    wf.innerHTML='<input type="number" inputmode="decimal" step="0.5" placeholder="'+(lastW||"–")+'"><span>кг</span>';
    const wi=wf.querySelector("input");wi.value=d.w;
    wi.oninput=()=>{d.w=wi.value;state.last[cur+"|"+i]=wi.value;if(d.d)recordHistory(cur,i);save();};
  }else{
    wf.innerHTML='<input type="text" value="Своё" disabled style="opacity:.45">';
  }
  row.appendChild(wf);

  const rf=document.createElement("div");rf.className="fld";
  rf.innerHTML='<input type="number" inputmode="numeric" placeholder="'+e.r+'"><span>'+(e.sec?"сек":"пвт")+'</span>';
  const ri=rf.querySelector("input");ri.value=d.r;
  ri.oninput=()=>{d.r=ri.value;if(d.d)recordHistory(cur,i);save();};
  row.appendChild(rf);

  const b=document.createElement("button");b.className="chk";
  b.setAttribute("aria-pressed",d.d);b.setAttribute("aria-label","Подход "+(j+1)+" выполнен");
  b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>';
  b.onclick=()=>{
    d.d=!d.d;
    if(d.d&&!d.r)d.r=e.r.split("-")[0];
    if(d.d&&e.w&&!d.w&&lastW){d.w=lastW;}
    recordHistory(cur,i);
    save();
    const isLast=(j===e.s-1);
    renderDay();
    if(d.d)startTimer(e.rest,isLast?nextExercise(i):e.n+" · подход "+(j+2)+" из "+e.s);
  };
  row.appendChild(b);
  return row;
}

function nextExercise(i){
  const p=PROGRAM[cur];
  return p.ex[i+1]?("Дальше: "+p.ex[i+1].n):"Тренировка завершена";
}
function fmt(s){return s>=60?(Math.floor(s/60)+(s%60?":"+String(s%60).padStart(2,"0"):" мин")):(s+" сек");}

function updateProgress(){
  const p=PROGRAM[cur];if(!p)return;
  let tot=0,done=0;
  p.ex.forEach((e,i)=>{
    let dn=0;
    for(let j=0;j<e.s;j++){tot++;if(slot(cur,i,j).d){done++;dn++;}}
    const card=main.querySelector('.ex[data-i="'+i+'"]');
    if(card&&dn===e.s)card.classList.add("complete");
  });
  const f=document.getElementById("fill"),c=document.getElementById("cnt");
  if(f)f.style.width=(tot?done/tot*100:0)+"%";
  if(c)c.textContent=done+" / "+tot+" подходов";
}

/* ---------- progress screen ---------- */
function spark(arr){
  if(arr.length<2)return "";
  const W=86,H=30,P=3;
  const vals=arr.map(a=>a.w);
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=(mx-mn)||1;
  const pts=vals.map((v,i)=>{
    const x=P+i*((W-P*2)/(vals.length-1));
    const y=H-P-((v-mn)/rng)*(H-P*2);
    return x.toFixed(1)+","+y.toFixed(1);
  });
  const lastUp=vals[vals.length-1]>=vals[0];
  const col=lastUp?"#48B58C":"#D96A5B";
  const [lx,ly]=pts[pts.length-1].split(",");
  return '<svg class="spark" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" aria-hidden="true">'+
    '<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+lx+'" cy="'+ly+'" r="2.6" fill="'+col+'"/></svg>';
}
function shortDate(s){const p=s.split("-");return p[2]+"."+p[1];}

function renderProgress(){
  main.innerHTML="";
  const h=state.hist||{};
  let any=false;
  for(const k in h){if(h[k].length)any=true;}
  if(!any){
    main.innerHTML='<div style="height:18px"></div><div class="restday"><b>Данных пока нет</b>Отметь подходы на тренировке - прогресс появится здесь после первой сессии.</div>';
    return;
  }
  ["mon","wed","fri","sun"].forEach(day=>{
    const p=PROGRAM[day];
    const g=document.createElement("div");g.className="pgroup";
    g.innerHTML='<h3>'+p.name+' · '+p.note+'</h3>';
    let shown=0;
    p.ex.forEach((e,i)=>{
      const arr=(h[day+"|"+i]||[]);
      if(!arr.length)return;
      shown++;
      const cur_=arr[arr.length-1], prev=arr.length>1?arr[arr.length-2]:null;
      const card=document.createElement("div");card.className="pex";
      let delta='<span class="pdelta flat">первая запись</span>';
      if(prev){
        const dw=cur_.w-prev.w, dv=cur_.v-prev.v;
        if(dw>0)delta='<span class="pdelta up">+'+trim(dw)+' кг</span>';
        else if(dw<0)delta='<span class="pdelta down">'+trim(dw)+' кг</span>';
        else if(cur_.r>prev.r)delta='<span class="pdelta up">+'+(cur_.r-prev.r)+' повт.</span>';
        else if(cur_.r<prev.r)delta='<span class="pdelta down">'+(cur_.r-prev.r)+' повт.</span>';
        else if(dv>0)delta='<span class="pdelta up">объём +'+dv+'</span>';
        else delta='<span class="pdelta flat">без изменений</span>';
      }
      const val=e.w
        ? '<div class="pnow">'+trim(cur_.w)+'<small>кг × '+cur_.r+'</small></div>'
        : '<div class="pnow">'+cur_.r+'<small>'+(e.sec?"сек":"повт")+'</small></div>';
      const hist=arr.slice(-6).map(a=>shortDate(a.d)+": "+(e.w?trim(a.w)+"кг×"+a.r:a.r+(e.sec?"с":""))).join("  ·  ");
      card.innerHTML='<div class="pname">'+e.n+'</div>'+
        '<div class="pline">'+val+delta+(e.w?spark(arr):"")+'</div>'+
        '<div class="phist">'+hist+'</div>';
      g.appendChild(card);
    });
    if(shown)main.appendChild(g);
  });
  const foot=document.createElement("div");foot.className="foot";
  const b=document.createElement("button");
  b.textContent="Стереть историю прогресса";
  b.onclick=()=>{if(confirm("Удалить всю историю? Это необратимо."))
    {state.hist={};save();renderProgress();}};
  foot.appendChild(b);main.appendChild(foot);
}
function trim(n){return (Math.round(n*10)/10).toString();}

function rulesHTML(){
  let v='<table class="vol">';
  VOLUME.forEach(r=>v+='<tr><td>'+r[0]+'</td><td>'+r[1]+'</td></tr>');
  v+='</table>';
  return '<div class="rules"><details><summary>Правила программы</summary><ol>'+
  '<li><b>Прогрессия двойная.</b> Вышел на верх диапазона во всех подходах - добавляй 2.5-5 кг и возвращайся к нижней границе.</li>'+
  '<li><b>1-3 повтора в запасе</b> в каждом рабочем подходе. Последний подход изоляции можно до отказа.</li>'+
  '<li><b>Рука.</b> Гантели вместо штанги первые 6-8 недель, брусья без веса первые 4-6.</li>'+
  '<li><b>Веса записывай сразу</b> - поле подставит прошлый вес в следующий раз.</li>'+
  '<li><b>Питание.</b> Дефицит 300-500 ккал, белок 1.8-2.2 г на кг. Без этого будет расти сила, но не изменится вид.</li>'+
  '<li><b>Пересмотр через 8-10 недель</b> или при остановке прогресса на 2-3 недели.</li>'+
  '</ol></details><details><summary>Недельный объём</summary>'+v+'</details></div>';
}

/* ---------- init ---------- */
let view="day";
const progBtn=document.getElementById("tab-prog");
const daysBar=document.getElementById("days");
progBtn.onclick=()=>{
  view=(view==="day")?"prog":"day";
  progBtn.classList.toggle("on",view==="prog");
  progBtn.textContent=(view==="prog")?"Тренировка":"Прогресс";
  daysBar.style.display=(view==="prog")?"none":"flex";
  if(view==="prog")renderProgress();else renderDay();
  window.scrollTo({top:0});
};

(function(){
  load();
  renderDays();renderDay();
})();
</script>
